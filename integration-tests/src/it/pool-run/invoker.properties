# glassfish-pool:run keeps Maven running until it's stopped, so verify.groovy runs it in Mavens of its own, in the
# background, and stops them.
invoker.goals=clean

# Ending one run while the other keeps its slot takes a SIGTERM, which runs the JVM's shutdown hooks, as Ctrl+C
# does. On Windows, destroy() ends a process without running them, and glassfish-pool:down would end both runs.
invoker.os.family=!windows
