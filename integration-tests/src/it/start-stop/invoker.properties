# Each invocation is a Maven of its own: GlassFish has to outlive the first.
invoker.goals.1=clean glassfish:start
invoker.name.1=Start
invoker.goals.2=verify
invoker.name.2=Test the running server
# clean deletes the install GlassFish runs from first, with its pid file and asadmin. Not on Windows,
# which keeps the files GlassFish has open: the pom skips clean there.
invoker.goals.3=clean glassfish:stop
invoker.name.3=Stop after clean
invoker.goals.4=glassfish:start
invoker.name.4=Start on a fresh install
invoker.goals.5=glassfish:stop
invoker.name.5=Stop

# start, suspended until a debugger attaches, which nobody does. On GlassFish 8,
# AS_START_TIMEOUT (in seconds) sets asadmin's own timeout. Ended by it, asadmin
# would leave the waiting server running, so start's deadline has to come first.
# GlassFish 7.1 ignores the variable.
# start fails then; --fail-never keeps the build successful, since the invoker
# skips verify.groovy after an invocation that fails.
invoker.goals.6=--fail-never glassfish:start -Dglassfish.start.suspend=true -Dglassfish.start.timeout=20
invoker.name.6=Start suspended, with nobody attaching
invoker.environmentVariables.AS_START_TIMEOUT.6=3
